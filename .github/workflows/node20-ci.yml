name: Node 20 CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - "feature/**"

jobs:
  verify:
    name: Verify on Node 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm run test --workspace=server -- --runInBand

      - name: Build server
        run: npm run build --workspace=server

      - name: Build web
        run: npm run build --workspace=web
